# QA regression manifest — master index, tracked by Asana task GID.
# Every task from the QA section of "Engineering Lifecycle" (project 1212777014402169) gets an
# entry: either a Playwright spec (gate: visible-change) or a recorded skip (gate: skipped).
# The agent only acts on tasks whose change is user-observable in the browser on the QA env.
# Updated by the /qa-gen skill (.claude/skills/qa-gen/SKILL.md). Rails-App is never modified.
# Agents validate new specs on desktop (chromium) only; the full matrix (chromium +
# mobile-chrome = Pixel 7 + mobile-safari = iPhone 15) is verified mechanically by
# `npm run qa:verify` (scripts/verify-manifest.mjs), which stamps status/verified_on and
# mobile_status/mobile_verified_on. New entries carry `mobile_status: pending` until that
# runs; while desktop is red-until-deployed, mobile runs are skipped on purpose.
# Production: `npm run qa:verify -- --prod` runs entries against the production site
# (PROD_* creds in .env), chromium only, stamping prod_status/prod_verified_on — but ONLY
# entries a human marked `prod: allowed`. Specs mutate account data, so review what each
# one touches before allowing it; `prod: never` (with prod_notes saying why) is the
# default for anything that creates durable records. Agents never set prod: allowed.
tasks:
  "1216798217670813":
    name: "Test Agent: Trim special whitespace from selected attributes"
    asana_url: "https://app.asana.com/1/1110661684743291/project/1215576041936942/t\
      ask/1216798217670813"
    gate: visible-change
    spec: tests/qa/asana-1216798217670813-name-whitespace-trim.spec.ts
    run: "npx playwright test
      tests/qa/asana-1216798217670813-name-whitespace-trim.spec.ts
      --project=chromium --workers=1"
    run_mobile: "npx playwright test
      tests/qa/asana-1216798217670813-name-whitespace-trim.spec.ts
      --project=mobile-chrome --project=mobile-safari --workers=1"
    generated_on: 2026-08-10
    status: green
    verified_on: 2026-08-13
    mobile_status: green
    prod: allowed
    prod_notes: >-
      Edits profile name fields and restores the originals in a finally block;
      creates no durable records. Reviewed 2026-08-10 — needs a dedicated prod
      test account.
    notes: >-
      AC scope: names normalized by trimming leading/trailing Unicode whitespace
      (NBSP, em space) and invisible characters (zero-width space, word joiner,
      BOM) from the first/middle/last name fields on the profile page; internal
      characters (a planted word joiner) are intentionally preserved per the
      AC's stated "ends only" scope. Spec edits the shared account's profile
      fields, saves, reloads, and asserts trimmed/preserved values, then
      restores the original values (captured at test start) in a finally block.
      Passed on chromium on first run; mobile verification pending npm run
      qa:verify.
    mobile_verified_on: 2026-08-13

