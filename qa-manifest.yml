# QA regression manifest — master index, tracked by Asana task GID.
# Every task from the QA section of "Engineering Lifecycle" (project 1212777014402169) gets an
# entry: either a Playwright spec (gate: visible-change) or a recorded skip (gate: skipped).
# The agent only acts on tasks whose change is user-observable in the browser on the QA env.
# Updated by the /qa-gen skill (.claude/skills/qa-gen/SKILL.md). Rails-App is never modified.
# Agents validate new specs on desktop (chromium) only; the full matrix (chromium +
# mobile-chrome = Pixel 7 + mobile-safari = iPhone 15) is verified mechanically by
# `npm run qa:verify` (scripts/verify-manifest.mjs), which stamps status/verified_on and
# mobile_status/mobile_verified_on. New entries carry `mobile_status: pending` until that
# runs; while desktop is red-until-deployed, mobile runs are skipped on purpose.
tasks:
  